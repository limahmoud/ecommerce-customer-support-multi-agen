services:

  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-customer_support}
      POSTGRES_USER: ${DB_USER:-support_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USER:-support_user} -d ${DB_NAME:-customer_support}
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    build: .
    env_file:
      - .env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432

    command: >
      python -c "from database.db import create_tables; create_tables()"

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

  api:
    build: .
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}

    command: >
      uvicorn api.api:app --host 0.0.0.0 --port 8000

    ports:
      - "8000:8000"

    depends_on:
      db-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build: .
    restart: unless-stopped

    environment:
      API_BASE_URL: http://api:8000

    command: >
      streamlit run frontend/app.py
      --server.address=0.0.0.0
      --server.port=8501

    ports:
      - "8501:8501"

    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
